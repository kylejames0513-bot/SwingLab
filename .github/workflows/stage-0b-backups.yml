name: Stage 0B backup foundation

on:
  pull_request:
    paths:
      - ".github/workflows/stage-0b-backups.yml"
      - "pyproject.toml"
      - "swinglab/backups/**"
      - "swinglab/cli.py"
      - "tests/test_backups.py"

permissions:
  contents: read

jobs:
  synthetic-backup-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -e ".[dev,backup]"
      - name: Validate dependency compatibility
        run: python -m pip check
      - name: Run synthetic backup and recovery tests
        run: python -m pytest tests/test_backups.py -q

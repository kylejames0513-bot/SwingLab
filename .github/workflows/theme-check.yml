name: Shopify Theme Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: theme-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  theme-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # The CLI directly, not Shopify/theme-check-action. The pinned action
      # targets Node 20, which GitHub's runners now force up to Node 24, and
      # the 3.58.x CLI it installs crashes rendering its own result banner
      # there — the job went red with zero theme offenses, and the crash ate
      # the output that would have said so. Running the same pinned CLI the
      # developers run locally removes the wrapper that was the only broken
      # part. 4.6.1 is the version this repo's theme work is validated
      # against; bump it deliberately, not transitively.
      - name: Use Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24

      - name: Validate Shopify theme
        run: npx -y @shopify/cli@4.6.1 theme check --path storefront-theme --fail-level warning

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swinglab"
version = "0.1.0"
description = "Golf swing analysis from a single phone video: metrics, key-position strips, slow motion, and centerline overlays."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "Pillow>=10.0",
    "mediapipe>=0.10.30",
    "PyYAML>=6.0",
    "Jinja2>=3.1",
]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
swinglab = "swinglab.cli:main"

[tool.setuptools.packages.find]
include = ["swinglab*"]

[tool.setuptools.package-data]
swinglab = ["templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]

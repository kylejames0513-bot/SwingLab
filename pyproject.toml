[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swinglab"
version = "0.1.0"
description = "Golf swing analysis from a single phone video: metrics, key-position strips, slow motion, and centerline overlays."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "Pillow>=10.0",
    "mediapipe>=0.10.30",
    "PyYAML>=6.0",
    "Jinja2>=3.1",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.1",   # signed login cookies (starlette SessionMiddleware)
    "stripe>=9.0",         # Pro subscriptions
    # Recovery-fence HEAD validation becomes a production dependency when
    # later composition activates Gate 3B's pure startup policy.
    "boto3>=1.37.32,<2",
    "httpx>=0.27,<1",      # Expo push provider (Task 7)
]
ops = [
    # Optional error monitoring: the app initializes Sentry only when the
    # SENTRY_DSN environment variable is set AND this package is installed
    # (see swinglab.web.app.init_sentry). Never a base dependency — every
    # error path works identically without it.
    "sentry-sdk>=2.0",
]
backup = [
    # Retained for explicit backup upload/download commands. The web extra has
    # its own transport dependency for later recovery-fence composition.
    # 1.37.32+ models the conditional PutObject precondition used to enforce
    # one writer and immutable completion markers.
    "boto3>=1.37.32,<2",
]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
swinglab = "swinglab.cli:main"
caddieinsight-backup = "swinglab.backups.__main__:main"

[tool.setuptools.packages.find]
include = ["swinglab*"]

[tool.setuptools.package-data]
swinglab = ["templates/*.j2", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
